name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Same "container integrity" gate as merkleye/merkleye's container-build
  # job — actually builds the Containerfile referenced from
  # merkleye/merkleye's deploy/docker-compose.yml, rather than trusting that
  # it merely parses.
  container-build:
    name: Build merkleye-certspotter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build merkleye-certspotter
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: false
          tags: merkleye-certspotter:ci
          cache-from: type=gha,scope=merkleye-certspotter
          cache-to: type=gha,mode=max,scope=merkleye-certspotter
