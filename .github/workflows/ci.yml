name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  container-build:
    permissions:
      contents: read
    uses: Merkleye/github-templates/.github/workflows/container-ci.yml@main
    with:
      images: '[{"image":"certspotter","context":".","file":"Containerfile"}]'
